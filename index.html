<style>
@font-face{font-family:Unbounded;src:url(unbounded.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:Manrope;src:url(manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#0B0B0D; --s1:#141417; --s2:#1B1B20; --s3:#232328; --line:rgba(255,255,255,.07);
  --tx:#F4F4F5; --tx2:#B4B4BE; --tx3:#9C9CA6; --tx4:#6E6E78;
  --acc:#D4FF3A; --mood:#D4FF3A; --vio:#8B7CFF; --amb:#FFB84D; --red:#FF5D73;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  --num:'Unbounded',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc);text-decoration:none}
svg.i{flex-shrink:0;display:block}
#app{max-width:480px;margin:0 auto;position:relative;min-height:100vh;overflow-x:hidden}
.page{position:relative;padding:calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 130px);display:flex;flex-direction:column;gap:20px}
.page.sub{padding-top:calc(var(--safe-t) + 14px)}
.glow{position:absolute;border-radius:50%;pointer-events:none;animation:drift 12s ease-in-out infinite;z-index:0}
.page>*:not(.glow){position:relative;z-index:1}
h1{margin:0;font-family:var(--num);font-size:28px;font-weight:600;letter-spacing:-.8px}
h2{margin:0;font-size:18px;font-weight:800}
.muted{color:var(--tx3)}
.small{font-size:12px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.col{display:flex;flex-direction:column}
.grow{flex-grow:1;min-width:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:26px;padding:18px}
.card.hero{background:linear-gradient(180deg,#17171B,#111114);border-radius:30px}
.mini{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mini .l{font-size:11px;color:var(--tx2)}
.mini .v{font-family:var(--num);font-size:16px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ibtn{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#C8C8D0;display:flex;align-items:center;justify-content:center}
.btn{min-height:50px;padding:0 18px;border-radius:18px;border:0;background:var(--acc);color:#0B0B0D;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--tx)}
.btn.dash{background:rgba(255,255,255,.02);border:1.5px dashed rgba(255,255,255,.16);color:#C8C8D0}
.btn.red{background:var(--red)}
.btn.block{width:100%}
.press{transition:transform .15s ease}
.press:active,.btn:active,.ibtn:active{transform:scale(.96)}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#C8C8D0;font-size:13px;font-weight:800;transition:background-color .25s,color .25s,border-color .25s}
.chip.on{background:var(--tx);color:#0B0B0D;border-color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;white-space:nowrap}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.seg{position:relative;display:grid;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.seg .knob{position:absolute;top:4px;bottom:4px;border-radius:12px;background:var(--tx);transition:left .45s cubic-bezier(.3,1.35,.5,1),background-color .3s}
.seg button{position:relative;min-height:40px;border:0;background:none;font-size:14px;font-weight:800;color:var(--tx3);transition:color .3s}
.seg button.on{color:#0B0B0D}
.switch{position:relative;width:50px;height:30px;flex-shrink:0;border-radius:15px;background:#2C2C33;transition:background-color .3s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(20px)}
.toggle{width:100%;display:flex;align-items:center;gap:12px;min-height:62px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--s1);text-align:left}
.ico{width:44px;height:44px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;font-weight:700;color:var(--tx3)}
.input{width:100%;min-height:48px;padding:0 14px;border-radius:16px;border:1px solid rgba(255,255,255,.08);background:var(--s1);color:var(--tx);font-size:16px}
.input:focus{outline:2px solid rgba(212,255,58,.5);outline-offset:1px}
input::placeholder{color:var(--tx4)}
.bar{height:6px;border-radius:3px;background:#26262C;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;transform-origin:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Movimientos */
.mov{position:relative;border-radius:20px;overflow:hidden}
.mov .acts{position:absolute;top:0;right:0;bottom:0;display:flex}
.mov .acts button{width:72px;border:0;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0B0B0D}
.mov .front{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.05);border-radius:20px;background:var(--s1);text-align:left;transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.mov.open .front{transform:translateX(var(--open,-216px))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 2px}
.dayhead span:first-child{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#8A8A94}
.dayhead span:last-child{font-size:12px;font-weight:700;color:var(--tx4)}

/* Tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);width:calc(100% - 32px);max-width:448px;height:72px;border-radius:28px;background:rgba(22,22,26,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.5);display:flex;justify-content:space-around;align-items:center;padding:0 4px;z-index:40}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:58px;min-height:48px;color:#8A8A94;font-size:10px;font-weight:700}
.tabbar a.on{color:var(--acc);font-weight:800}
.tabbar .fab{position:relative;width:60px;height:60px;min-width:60px;margin-top:-38px;border-radius:50%;background:var(--acc);color:#0B0B0D;box-shadow:0 12px 30px var(--moodglow,rgba(212,255,58,.35))}
.tabbar .fab::before{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--mood);animation:pulseRing 2.2s ease-out infinite}

/* Hoja inferior y avisos */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fadeIn .25s ease both}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:#141417;border-radius:28px 28px 0 0;border-top:1px solid rgba(255,255,255,.08);padding:10px 18px calc(var(--safe-b) + 22px);z-index:61;animation:sheetUp .45s cubic-bezier(.3,1.2,.5,1) both;display:flex;flex-direction:column;gap:14px}
.scrim.still,.sheet.still{animation:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#3A3A42;align-self:center;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 100px);width:calc(100% - 32px);max-width:448px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:18px;background:var(--tx);color:#0B0B0D;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:70;animation:toastIn .45s var(--spring) both}
.toast b{flex-grow:1;font-size:14px}
.toast button{min-height:38px;padding:0 14px;border-radius:12px;border:0;background:#0B0B0D;color:var(--acc);font-size:13px;font-weight:800}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;font-size:13px;font-weight:700}


/* Tabla tipo Excel */
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tablewrap::-webkit-scrollbar{display:none}
table.xl{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
table.xl th{position:sticky;left:0;z-index:2;background:#0B0B0D;text-align:left;font-weight:700;padding:9px 12px 9px 2px;white-space:nowrap;min-width:132px;max-width:150px;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.05);box-shadow:6px 0 10px -6px rgba(0,0,0,.8)}
table.xl td{padding:9px 10px;text-align:right;white-space:nowrap;min-width:62px;border-bottom:1px solid rgba(255,255,255,.05);font-weight:600;color:#DADAE0}
table.xl td.tot{background:#141417;color:var(--tx);font-weight:800}
table.xl td.fut{color:#2C2C33;text-align:center}
table.xl tr.hd td,table.xl tr.hd th{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3)}
table.xl tr.hd button{border:0;background:rgba(255,255,255,.07);color:var(--tx);font-size:11px;font-weight:800;padding:6px 9px;border-radius:8px;text-transform:uppercase}
table.xl tr.sec th{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc);padding-top:18px;font-weight:800}
table.xl tr.sec td{border-bottom-color:transparent}
table.xl tr.strong th,table.xl tr.strong td{font-weight:800;color:var(--tx);border-top:1px solid rgba(255,255,255,.14)}
table.xl th .dot{display:inline-block;margin-right:7px;vertical-align:middle}

/* Logos de comercios */
.logo{position:relative;flex-shrink:0;display:block}
.logo .lt{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.logo .lt img{width:64%;height:64%;object-fit:contain;display:block}
.logo .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.logo.bad .lt{display:none}
.logo.bad .fb{display:flex}
.logo .cdot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--s1)}
.card.hero .logo .cdot{border-color:#17171B;width:20px;height:20px}
.movlite{color:var(--tx);transition:transform .15s ease}
.movlite:active{transform:scale(.98)}
.mov .front{touch-action:pan-y}
/* Esqueleto */
.sk{background:linear-gradient(90deg,#141417 0%,#202026 50%,#141417 100%);background-size:200% 100%;animation:skel 1.3s linear infinite}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
/* Tirar para sincronizar */
#ptr{position:fixed;left:50%;top:calc(var(--safe-t) + 4px);width:40px;height:40px;margin-top:0;border-radius:50%;background:#1B1B20;border:1px solid rgba(255,255,255,.1);color:var(--tx3);display:flex;align-items:center;justify-content:center;z-index:45;opacity:0;transform:translate(-50%,-46px);transition:opacity .2s,color .2s,background-color .2s;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#ptr.ready{color:#0B0B0D;background:var(--acc)}
#ptr.spin{color:#0B0B0D;background:var(--acc);opacity:1;transition:transform .3s var(--spring),opacity .2s}
#ptr.spin svg{animation:spin .8s linear infinite}
@keyframes dotPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
/* Transiciones entre pantallas */
.tabbar{view-transition-name:tabbar}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
::view-transition-old(root){animation-name:vtOutFwd}
::view-transition-new(root){animation-name:vtInFwd}
html[data-dir=back]::view-transition-old(root){animation-name:vtOutBack}
html[data-dir=back]::view-transition-new(root){animation-name:vtInBack}
html[data-dir=up]::view-transition-old(root){animation-name:fadeOutVT}
html[data-dir=up]::view-transition-new(root){animation-name:vtInUp;animation-duration:.4s}
html[data-dir=down]::view-transition-old(root){animation-name:vtOutDown;animation-duration:.3s}
html[data-dir=down]::view-transition-new(root){animation-name:fadeInVT}
::view-transition-group(movcard){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.15,.4,1)}
@keyframes vtInFwd{from{transform:translateX(28%);opacity:0}}
@keyframes vtOutFwd{to{transform:translateX(-12%);opacity:0}}
@keyframes vtInBack{from{transform:translateX(-28%);opacity:0}}
@keyframes vtOutBack{to{transform:translateX(12%);opacity:0}}
@keyframes vtInUp{from{transform:translateY(40%);opacity:0}}
@keyframes vtOutDown{to{transform:translateY(40%);opacity:0}}
@keyframes fadeOutVT{to{opacity:0}}
@keyframes fadeInVT{from{opacity:0}}
/* Teclado */
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{min-height:54px;border-radius:18px;border:0;background:#16161A;font-family:var(--num);font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .08s ease,background-color .08s ease;touch-action:manipulation}
.keys button.hit{transform:scale(.94);background:rgba(212,255,58,.12)}
.catgrid{display:flex;gap:4px;overflow-x:auto;margin:0 -16px;padding:4px 16px 4px;scroll-padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.catgrid::-webkit-scrollbar{display:none}
.catgrid .catbtn{flex:0 0 74px;scroll-snap-align:start}
.catgrid .catbtn span:last-child{max-width:74px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Añadir sin scroll */
.addpg{min-height:100vh;min-height:100dvh;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 14px);gap:12px}
.addpg .amtv{font-size:56px;letter-spacing:-2.5px}
.addpg .amtcur{height:48px}
.recs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.recs::-webkit-scrollbar{display:none}
.recs .chip{min-height:36px;padding:0 12px 0 6px;gap:6px;font-size:12.5px;color:var(--tx)}
.recs .chip .b{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.recs .chip em{font-style:normal;color:var(--tx3);font-weight:700}
.detrow{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px 8px 8px;border-radius:18px;border:1px solid var(--line);background:var(--s1);text-align:left}
.detrow .b{width:36px;height:36px;flex-shrink:0;border-radius:12px;background:rgba(255,255,255,.05);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.detrow .s{font-size:12.5px;color:var(--tx3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detrow .thumb{width:52px;height:52px;flex-shrink:0;border-radius:12px;object-fit:cover;background:rgba(90,200,255,.14);color:#5AC8FF;display:flex;align-items:center;justify-content:center}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(212,255,58,.0)}25%{box-shadow:0 0 0 5px rgba(212,255,58,.28);border-color:rgba(212,255,58,.6)}100%{box-shadow:0 0 0 0 rgba(212,255,58,0)}}
@media (max-height:700px){
  .addpg{gap:8px;padding-top:calc(var(--safe-t) + 8px);padding-bottom:calc(var(--safe-b) + 10px)}
  .addpg .amtv{font-size:46px}
  .addpg .amtcur{height:38px}
  .keys button{min-height:48px;border-radius:15px}
  .addpg .catbtn .b{width:48px;height:48px;border-radius:16px}
  .addpg .savebtn{min-height:52px!important}
  .addpg .detrow{min-height:46px;padding-top:5px;padding-bottom:5px}
}
.recs .chip.devchip{padding:0 12px;color:var(--acc);border:1px dashed rgba(212,255,58,.4);background:rgba(212,255,58,.04)}
.recs .chip.devchip.on{background:var(--acc);border:1px solid var(--acc);color:#0B0B0D}
/* Pendiente de cobro */
.owed{padding:16px;display:flex;flex-direction:column;gap:2px}
.owedrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.owed .between+.owedrow{border-top:0}
.cobbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;background:rgba(212,255,58,.1);border:1px solid rgba(212,255,58,.22);color:var(--acc);font-size:13px;font-weight:800;flex-shrink:0}
/* ¿Apartas? */
.goalbox{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md,16px);background:#0F0F12;border:1px solid var(--line)}
.btn.sec{background:var(--s2,#1B1B20);border:1px solid var(--line);color:var(--tx)}
.btn.ghost.block[data-act="sheet-close"]{background:none;color:var(--tx2);min-height:44px}
.grid3 .mini{justify-content:space-between}
.mini .l{line-height:1.25}
/* Céntimos subordinados en importes grandes */
.eur .c{font-size:.55em;font-weight:500;color:var(--tx3);vertical-align:.38em;letter-spacing:0}
.oncolor .eur .c{color:inherit;opacity:.55}
/* Truco de vibración (iOS 18+) */
.hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border:0;background:none;color:var(--tx3);transition:transform .35s cubic-bezier(.3,1.5,.5,1),color .25s}
.catbtn .b{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:background-color .3s,color .3s,box-shadow .3s,border-color .3s}
.catbtn span:last-child{font-size:11px;font-weight:700;text-align:center;line-height:1.15;max-width:74px}
.catbtn.on{transform:scale(1.06);color:var(--tx)}
.catbtn.on span:last-child{font-weight:800}

/* Animaciones */
.in{animation:rise .6s var(--ease) both;animation-delay:var(--d,0s)}
.fade{animation:fadeIn .6s ease both;animation-delay:var(--d,0s)}
.draw{animation:drawIn 1.4s var(--ease) both;animation-delay:var(--d,.3s)}
.growx{animation:growX 1.2s var(--ease) both;animation-delay:var(--d,.4s)}
.growy{transform-origin:bottom;animation:growY .8s var(--ease) both;animation-delay:var(--d,.2s)}
.popin{animation:popIn .45s var(--spring) both;animation-delay:var(--d,0s)}
.noanim .in,.noanim .fade,.noanim .draw,.noanim .growx,.noanim .growy,.noanim .popin{animation:none}
.pop{animation:pop .3s var(--spring)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes drawIn{from{stroke-dasharray:0 1000}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(36px,24px) scale(1.1)}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(212,255,58,.6)}80%,100%{box-shadow:0 0 0 7px rgba(212,255,58,0)}}
@keyframes amberPulse{0%{box-shadow:0 0 0 0 rgba(255,184,77,.6)}80%,100%{box-shadow:0 0 0 7px rgba(255,184,77,0)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sheetUp{from{transform:translate(-50%,100%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.96)}}
@keyframes burst{to{transform:translateY(-120px) rotate(220deg) scale(.3);opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bubble{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-80px);opacity:0}}
@keyframes fillUp{from{top:100%}}
@keyframes fillA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fillB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-24px) scale(.95)}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ===== Familia WEBS_APPS v1 · 17 nov 2026 · bloque común, igual en las tres apps ===== */
:root{
  --bg:#0B0B0D;--s1:#141417;--s2:#1B1B20;--s3:#24242A;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);
  --glass:rgba(22,22,26,.72);
  --tx:#F4F4F5;--tx2:#A1A1AA;--tx3:#8E8E98;
  --ok:#3DD68C;--warn:#FFB84D;--bad:#FF5D73;
  --f-num:'Unbounded',system-ui,sans-serif;--f-tx:'Manrope',system-ui,sans-serif;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--gutter:16px;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --sh-float:0 16px 40px rgba(0,0,0,.5);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
  --d-1:150ms;--d-2:300ms;--d-3:450ms;--press:.97;
}
.eyebrow{font-family:var(--f-tx);font-size:13px;font-weight:700;line-height:1.3;letter-spacing:0;text-transform:none;color:var(--tx2)}

:root{--acc-ink:#0B0B0D;--vio:#5AC8FF;--tx4:#6E6E78}
/* tx4 solo para placeholder y deshabilitado */
.dayhead span:last-child{color:var(--tx3)}
/* G1 · nada en bucle alrededor del bloque lima */
.glow{animation:none}
.tabbar .fab::before{content:none}

.tabbar{height:70px;bottom:calc(var(--safe-b) + 12px)}

.tabbar .fab{width:60px;height:60px;min-width:60px;border-radius:20px;margin-top:-28px}
.press:active,.btn:active,.ibtn:active{transform:scale(var(--press))}
/* G3 · etiquetas en minúscula */
.dayhead span:first-child,table.xl tr.sec th,table.xl tr.hd td,table.xl tr.hd th,table.xl tr.hd button{font-family:var(--f-tx);font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--tx2)}

.card{border-radius:var(--r-lg)}
.card.hero{border-radius:var(--r-xl);background:var(--s1)}
.mini,.mov,.mov .front,.toggle,.detrow,.btn,.input{border-radius:var(--r-md)}

<script>
if ('serviceWorker' in navigator) {
  // Cuando se instala una versión nueva de la app, recarga una vez para mostrarla.
  var hadController = !!navigator.serviceWorker.controller;
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      reg.update();
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update(); });
    });
  });
}
</script>
